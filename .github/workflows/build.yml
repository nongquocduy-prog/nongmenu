
name: Build Ongnongios1 dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Detect and extract source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf buildsrc
          mkdir -p buildsrc

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
            -maxdepth 1 -type f -iname '*.zip' \
            | sort -V | tail -1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Không tìm thấy ZIP source"
            exit 1
          fi

          echo "Building: $(basename "$ZIP_FILE")"

          unzip -q -o "$ZIP_FILE" -d buildsrc

          if [ ! -d buildsrc/s82 ]; then
            echo "ERROR: Không tìm thấy thư mục s82"
            exit 1
          fi

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail

          cd buildsrc/s82

          test -f Makefile
          test -f build_github.sh
          test -f vfy.sh

          bash -n build_github.sh
          bash -n vfy.sh

          chmod +x build_github.sh vfy.sh

          echo "Source structure OK"

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid xz

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail

          git clone --recursive --depth 1 \
            https://github.com/theos/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$HOME/theos/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            "$HOME/theos/sdks"

          ls -lah "$HOME/theos/sdks"

      - name: Generate Build ID
        shell: bash
        run: |
          set -euo pipefail

          BUILD_ID="ongnong_GH${GITHUB_RUN_ID}_A${GITHUB_RUN_ATTEMPT}"

          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "ONGNONG_BUILD_CHANNEL=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Build dylib
        shell: bash
        env:
          THEOS_TARGET_OVERRIDE: iphone:clang:16.5:14.0
        run: |
          set -euo pipefail

          cd buildsrc/s82
          ./build_github.sh

      - name: Prepare Ongnongios1.dylib
        shell: bash
        run: |
          set -euo pipefail

          cd buildsrc/s82

          if [ -s Ongnongios1.dylib ]; then
            echo "Output exists"
          elif [ -s Ongnongos.dylib ]; then
            cp Ongnongos.dylib Ongnongios1.dylib
          elif [ -s .theos/obj/debug/Ongnongos.dylib ]; then
            cp .theos/obj/debug/Ongnongos.dylib Ongnongios1.dylib
          else
            echo "ERROR: Không tìm thấy dylib"
            exit 1
          fi

          test -s Ongnongios1.dylib

          file Ongnongios1.dylib
          lipo -info Ongnongios1.dylib

          echo "BUILD OK: Ongnongios1.dylib"

      - name: Install Telegram uploader
        shell: bash
        run: |
          python3 -m pip install --break-system-packages telethon

      - name: Send dylib to Telegram
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import asyncio
          from telethon import TelegramClient
          from telethon.sessions import MemorySession

          async def main():
              required = [
                  "TELEGRAM_API_ID",
                  "TELEGRAM_API_HASH",
                  "TELEGRAM_BOT_TOKEN"
              ]

              if any(not os.getenv(k) for k in required):
                  print("Telegram secrets missing")
                  return

              client = TelegramClient(
                  MemorySession(),
                  int(os.environ["TELEGRAM_API_ID"]),
                  os.environ["TELEGRAM_API_HASH"]
              )

              await client.start(
                  bot_token=os.environ["TELEGRAM_BOT_TOKEN"]
              )

              try:
                  await client.send_file(
                      "@filedylib",
                      "buildsrc/s82/Ongnongios1.dylib",
                      caption=(
                          "Ongnongios1.dylib\n"
                          f"BUILD ID: {os.environ['BUILD_ID']}"
                      ),
                      force_document=True
                  )
              finally:
                  await client.disconnect()

          asyncio.run(main())
          PY

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Ongnongios1-${{ github.run_id }}
          path: buildsrc/s82/Ongnongios1.dylib
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
